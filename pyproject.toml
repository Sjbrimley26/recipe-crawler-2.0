[project]
name = "recipe-scraper"
version = "0.1.0"
description = "Polite recipe crawler: JSON-LD extraction, resumable, normalized ingredients (Python rewrite of Sjbrimley26/recipe-app crawler)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
